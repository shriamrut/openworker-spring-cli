name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install Dependencies & Setup Configs
      run: |
        npm install
        npm install --save-dev webpack-cli typescript ts-loader
        
        # Create a basic tsconfig.json if it doesn't exist
        if [ ! -f tsconfig.json ]; then
          npx tsc --init
        fi

        # Create webpack.config.cjs (.cjs forces CommonJS mode)
        cat << 'EOF' > webpack.config.cjs
        const path = require('path');

        module.exports = {
          mode: 'production',
          entry: './src/index.ts',
          module: {
            rules: [
              {
                test: /\.tsx?$/,
                use: 'ts-loader',
                exclude: /node_modules/,
              },
            ],
          },
          resolve: {
            extensions: ['.tsx', '.ts', '.js'],
          },
          output: {
            filename: 'bundle.js',
            path: path.resolve(__dirname, 'dist'),
          },
        };
        EOF

    - name: Build
      run: |
        npx webpack --config webpack.config.cjs
